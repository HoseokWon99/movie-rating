<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Main | Cine Agora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        body {
            background-color: #f8fafa;
        }
        .movie-card {
            width: 200px;
            flex: 0 0 auto;
            margin-right: 1rem;
        }
        .movie-card img {
            height: 300px;
            object-fit: cover;
        }
        .scrolling-wrapper {
            overflow-x: auto;
            display: flex;
            flex-wrap: nowrap;
            padding-bottom: 1rem;
        }
        .section-title {
            font-weight: bold;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body class="bg-light">
<div class="container my-5">

    <!-- Latest Movies Section -->
    <h3 class="section-title">📽️ Latest Movies</h3>
    <div class="scrolling-wrapper" id="latest-movies">
    </div>

    <!-- Hottest Movies Section -->
    <h3 class="section-title mt-5">🔥 Hottest Movies</h3>
    <div class="scrolling-wrapper" id="hottest-movies">
    </div>
</div>
<script src="/js/render-navbar.js"></script>
<script>
   const renderMovieCard = (i) => (`
        <div class="card movie-card">
            <img src="#" class="card-img-top" alt="Movie Poster">
            <div class="card-body">
                <h6 class="card-title">Movie ${i}</h6>
                <p class="card-text text-muted">2025 · Thriller</p>
            </div>
        </div>
   `);
</script>
<script>
    window.onload = async function() {
        document.body.insertAdjacentHTML("afterbegin", await renderNavbar());

        document.querySelectorAll(".scrolling-wrapper")
                .forEach(elem => {

                   for (let i = 0; i !== 20; ++i)
                       elem.insertAdjacentHTML("beforeend", renderMovieCard(i+1));

                });
    }

</script>
<script src="https://kit.fontawesome.com/12c52f4733.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
