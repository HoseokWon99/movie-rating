<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>회원가입 - Cine Agora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">

<div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="card shadow p-4" style="width: 100%; max-width: 400px;">
        <form method="POST" action="/api/users/sign-up">
            <div class="mb-3">
                <label for="name-input" class="form-label">성함</label>
                <input name="name" type="text" id="name-input" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="email-input" class="form-label">이메일</label>
                <input name="email" type="email" id="email-input" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="password-input" class="form-label">비밀번호</label>
                <input
                        name="password"
                        type="password"
                        id="password-input"
                        class="form-control"
                        placeholder="8-15 자리 & 문자, 숫자, 특수문자 각각 1개 이상"
                        required
                >
            </div>
            <div class="d-grid mb-3">
                <button type="submit" id="submit-btn" class="btn btn-primary">회원가입</button>
            </div>
            <p class="text-center mb-0">이미 계정이 있으신가요? <a href="/users/sign-in">로그인</a></p>
        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
