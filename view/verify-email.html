<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Email Verification</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        .status-icon {
            font-size: 3rem;
        }
    </style>
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">
<div class="card shadow p-5 text-center" style="max-width: 500px;">
    <div id="verification-result">
        <div class="spinner-border text-primary mb-3" role="status"></div>
        <h4>잠시만 기다려주세요...</h4>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/render-email-verification-result.js"></script>
<script>
   window.onload = async function() {
       const resultDiv = document.getElementById("verification-result");
       const key = window.location.pathname.split('/').at(-1);
       console.log(key);

       await fetch(`/api/users/verification/verify-email/${key}`)
               .then(res => {
                   resultDiv.innerHTML = res.ok ? renderSuccess() : renderFailure();
               })
               .catch(err => {
                   resultDiv.innerHTML = renderFailure();
               })
   }
</script>
</body>
</html>
