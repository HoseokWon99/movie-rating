<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>로그인 - Cine Agora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">

<div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="card shadow p-4" style="width: 100%; max-width: 400px;">
        <h3 class="text-center mb-4">Sign In</h3>
        <form>
            <div class="mb-3">
                <label for="email-input" class="form-label">이메일</label>
                <input
                        type="email"
                        id="email-input"
                        class="form-control"
                        required
                >
            </div>
            <div class="mb-3">
                <label for="password-input" class="form-label">패스워드</label>
                <input
                        type="password"
                        id="password-input"
                        class="form-control"
                        required
                >
            </div>
            <div class="d-grid mb-3">
                <button type="button" class="btn btn-dark" id="submit-btn">로그인</button>
            </div>
            <div class="d-flex justify-content-center gap-3 mb-4">
                <button
                        id="kakao-btn"
                        type="button"
                        class="btn btn-outline-light border-0 d-flex flex-column align-items-center p-2"
                >
                    <img src="https://www.svgrepo.com/svg/346019/kakao-talk-fill" width="24" alt="Google">
                </button>
            </div>
            <div class="text-end mb-3">
                <a href="/users/sign-up">회원가입</a> / <a href="#">비밀번호 재설정</a>
            </div>
        </form>
        <div class="modal fade" id="modal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content text-center">
                    <div class="modal-body" id="modal-message">
                        입력하신 이메일 주소로 인증 메일이 발송되었습니다.
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    window.onload = async function () {

        document.getElementById("submit-btn")
                .addEventListener("click", async (e) => {
                    e.preventDefault();
                })


    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
