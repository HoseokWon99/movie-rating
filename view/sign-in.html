<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>로그인 - Cine Agora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">

<div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="card shadow p-4" style="width: 100%; max-width: 400px;">
        <h3 class="text-center mb-4">Sign In</h3>
        <form>
            <div class="mb-3">
                <label for="email-input" class="form-label">이메일</label>
                <input
                        type="email"
                        id="email-input"
                        class="form-control"
                        required
                >
            </div>
            <div class="mb-3">
                <label for="password-input" class="form-label">패스워드</label>
                <input
                        type="password"
                        id="password-input"
                        class="form-control"
                        required
                >
            </div>
            <div class="d-grid mb-3">
                <button type="submit" class="btn btn-dark" id="submit-btn">로그인</button>
            </div>
            <div class="d-flex justify-content-center gap-3 mb-4">
                <button
                        id="kakao-btn"
                        type="button"
                        class="btn btn-outline-light border-0 d-flex flex-column align-items-center p-2"
                >
                    <img src="https://www.svgrepo.com/svg/346019/kakao-talk-fill" width="24" alt="Google">
                </button>
            </div>
            <div class="text-end mb-3">
                <a href="/users/sign-up">회원가입</a> / <a href="#">비밀번호 재설정</a>
            </div>
        </form>
    </div>
</div>
<script>
    window.onload = function () {

        document.querySelector("form").addEventListener("submit", async (e) => {
            e.preventDefault();
            await handleSignIn();
        });

        async function handleSignIn() {
            const email = document.getElementById("email-input").value;
            const password = document.getElementById("password-input").value;

            try {
                const res = await fetch("http://localhost:3000/api/auth/sign-in", {
                    method: "POST",
                    headers: {"Content-Type": "application/json; charset=UTF-8"},
                    body: JSON.stringify({ email, password })
                });

                console.log(res.status);

                if (res.ok) {
                    const { accessToken } = await res.json();
                    localStorage.setItem("TOKEN", accessToken);
                    window.location.href = "/main";
                } else {
                    console.error("Sign-in failed");
                }
            } catch (err) {
                console.error("Error during sign-in:", err);
            }
        }

    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
