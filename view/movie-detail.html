<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Movie Detail - The Review Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">
<!-- Detail -->
<div class="container bg-white rounded shadow p-4 mb-5" id="movie-detail"></div>
<div class="container bg-white rounded shadow p-4 mb-4" id="credits"></div>
<!-- Review Section -->
<div class="container my-5">
    <h3>리뷰</h3>
    <div class="card mb-4" id="reviews"></div>
</div>
<script src="/js/render-navbar.js"></script>
<script src="/js/render-credits.js"></script>
<script src="/js/render-detail.js"></script>
<script src="/js/render-header.js"></script>
<script src="/js/render-footer.js"></script>
<script src="/js/render-review-body.js"></script>
<script>
    window.onload = async function() {
        const token = getAccessToken();
        document.body.insertAdjacentHTML("afterbegin", await renderNavbar(token));

        const detailDiv = document.getElementById("movie-detail");
        const creditsDiv = document.getElementById("credits");
        const reviewsDiv = document.getElementById("reviews");

        const movieId = window.location
                .pathname.split('/').at(-1);

        console.log(movieId);

        const movie = await fetch(`/api/movies/${movieId}`)
                .then(res => res.json());

        detailDiv.innerHTML = renderDetail(movie);
        creditsDiv.innerHTML = renderCredits(movie);

        //const reviews = await fetch(`api/reviews`)
        //.then(res => res.json())
        //.then(data => data.reviews);

        const reviews = [{
            id: 0,
            title: "test",
            content: "test",
            rating: 3.5,
            likes: 155,
            profile: {
                userId: 1,
                nickname: "test-user",
                imageURL: "/img/default_profile_image.png",
            },
            comments: [{
                id: 0,
                reviewId: 0,
                content: "test"
            }]
        }];

        reviewsDiv.innerHTML = `${reviews.map(review => (`
            <div id="review-${review.id}" class="container" style="margin: auto;">
                ${renderHeader(review)}
                ${renderReviewBody(review)}
                ${renderFooter(review)}
            </div>
        `))}`;

        //fetch(`/api/reviews/movie-reviews/${movieId}`).then(res => res.json()).then(renderReview);
    }

</script>
<script src="https://kit.fontawesome.com/12c52f4733.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
